<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#10151d">
    <title>StuPeasy Radial Incremental RPG</title>
    <style>
      html, body { width: 100%; height: 100vh; height: 100dvh; margin: 0; overflow: hidden; background: #10151d; touch-action: none; }
      #unity-canvas { position: fixed; inset: 0; width: 100vw !important; height: 100vh !important; height: 100dvh !important; background: #1F1F20; outline: none; }
      #loading { position: fixed; left: 15%; right: 15%; top: 50%; height: 8px; transform: translateY(-50%); background: #1c2633; border: 2px solid #05070a; z-index: 2; }
      #progress { width: 0; height: 100%; background: #29dc69; }
      #warning { position: fixed; left: 8px; right: 8px; top: 8px; z-index: 3; color: #fff; font: 700 14px sans-serif; text-shadow: 1px 1px #000; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" width=540 height=960 tabindex="-1"></canvas>
    <div id="loading"><div id="progress"></div></div>
    <div id="warning"></div>
    <script src="stu-peasy/Build/WebGL.loader.js?v=202609010141"></script>
    <script>
      const canvas = document.querySelector("#unity-canvas");
      const loading = document.querySelector("#loading");
      const progress = document.querySelector("#progress");
      const warning = document.querySelector("#warning");
      const showBanner = (message, type) => {
        const line = document.createElement("div");
        line.textContent = message;
        line.style.background = type === "error" ? "#b51e2e" : "#765b00";
        line.style.padding = "8px";
        warning.appendChild(line);
        if (type !== "error") setTimeout(() => line.remove(), 5000);
      };
      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "stu-peasy/Build/WebGL.data.unityweb?v=202609010141",
        frameworkUrl: "stu-peasy/Build/WebGL.framework.js.unityweb?v=202609010141",
        codeUrl: "stu-peasy/Build/WebGL.wasm.unityweb?v=202609010141",
        streamingAssetsUrl: "stu-peasy/StreamingAssets",
        companyName: "StuPeasy",
        productName: "StuPeasy Radial Incremental RPG",
        productVersion: "0.1.0",
        autoSyncPersistentDataPath: true,
        showBanner
      }, value => progress.style.width = `${Math.round(value * 100)}%`)
        .then(() => loading.remove())
        .catch(message => showBanner(message, "error"));
    </script>
  </body>
</html>
