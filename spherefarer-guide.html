var(--muted)}.top-link{display:inline-block;margin-top:16px}.nojs{padding:20px;max-width:900px;margin:auto}.mobile-nav{display:none}.source-list{font-size:13px;overflow-wrap:anywhere}.support-table td:nth-child(2),.support-table td:nth-child(3){white-space:nowrap}

  <div class="layout" id="top"><aside class="sidebar"><p class="nav-caption" id="nav-caption"></p><nav id="desktop-nav" aria-label="Разделы"></nav></aside><main id="main" tabindex="-1"><details class="mobile-nav"><summary id="mobile-summary"></summary><nav id="mobile-nav" aria-label="Разделы"></nav></details><div id="guide"></div></main></div>
  <script>
  // Bilingual editorial content is kept apart from rendering. Pair order: Russian, English.
  const ui = {
    title:['Руководство по игре','Player guide'],contents:['Содержание','Contents'],skip:['К содержимому','Skip to content'],print:['Печать / PDF','Print / PDF'],
    eyebrow:['МИР · БОЙ · ЭКИПИРОВКА · КУЗНЯ','WORLD · COMBAT · EQUIPMENT · FORGE'],
    intro:['Ты управляешь движением. Оружие само выбирает цели, а сила растёт с каждым убийством. Здесь — правила мира, сборки экипировки и точные различия между эффектами крафта.','You steer. Weapons choose their targets automatically, and every kill makes you stronger. This guide explains the world, equipment builds, and how crafting effects differ between carriers.'],
    meta:['Сверено с исходниками 6 октября 2026 · версия с процедурными данжами · RU / EN · работает офлайн','Checked against source on 6 October 2026 · procedural dungeon version · RU / EN · works offline'],
    quick:['Начать играть','Start here'],forge:['Рецепты кузни','Forge recipes'],play:['Открыть бету ↗','Play beta ↗'],
    carrier:['Тип предмета в базовом слоте','Item in the Base slot'],legend:['B — базовый предмет · X — обязательный катализатор · + — необязательное усиление · · — пустая клетка. Сетка показана как в игре: верхний ряд сверху.','B — Base Item · X — required catalyst · + — optional strengthening · · — empty cell. The grid has the same orientation as the in-game Anvil.'],
    recipeLabels:['Базовый предмет, обязательные катализаторы и необязательное усиление','Base item, required catalysts and optional strengthening'],
    auraAlt:['Для Aura допустима и диагональная оболочка: X в четырёх углах, B в центре; боковые клетки необязательны.','Aura also accepts a diagonal shell: X in all four corners, B at the centre; side cells are optional.'],
    back:['К началу ↑','Back to top ↑'],effect:['Эффект','Effect'],cooldown:['Базовый КД','Base cooldown'],duration:['Действие','Duration'],threshold:['Доступен при Lineage','Available at Lineage'],description:['Что делает','What it does'],
    cap:['Максимум сложности','Maximum difficulty'],chance:['Шанс','Chance'],stat:['Параметр','Stat'],meaning:['Значение','Meaning'],
    fullPrint:['Печать включает все семь вкладок крафта на выбранном языке.','Printing includes all seven crafting tabs in the selected language.'],
    footer:['Это документация текущей реализации, а не обещание будущих механик. Названия кнопок и эффектов на английском оставлены рядом с переводом, чтобы их было легко найти в игре.','This guide describes the current implementation, not planned features. English button and effect names are retained alongside Russian translations so they remain easy to find in the game.']
  };
  const sections = [
    {id:'start',title:['Первые десять минут','Your first ten minutes'],lead:['Не нужно выбирать класс навсегда: сборку определяет экипировка, а сохранённые лоадауты переключаются мгновенно.','There is no permanent class choice. Your equipment defines your build, and saved loadouts switch instantly.'],cards:[
      {title:['1. Пролог и первый маршрут','1. Prologue and first route'],paragraphs:[['Начни у центральной стелы и прочитай надпись. Шесть учебных секторов вокруг центра занимают одну обычную локацию; подсказки предлагают следующий шаг, но не запрещают исследовать поля.','Start at the central stella and read its inscription. Six tutorial sectors surround the centre inside one normal-sized location. Hints suggest discoveries without preventing you from exploring.'],['Двигайся к врагам: подходящее оружие атакует автоматически. Убей первого гейтбосса, получи лук и надень его через BAG. Побочные пачки дают дополнительные награды.','Move toward enemies: suitable weapons attack automatically. Defeat the first Gate Boss, collect the bow, and equip it through BAG. Optional packs give extra rewards.']]},
      {title:['2. Пробуй сборку, не копи уровни','2. Experiment instead of grinding levels'],paragraphs:[['Здесь нет обычных уровней персонажа и дерева классов. Убийства дают постоянные характеристики; предметы добавляют урон, бонусы и особые действия. Можно смешивать мили, луки, посохи и поддержку.','There are no conventional character levels or class trees. Kills grant permanent stats; equipment adds damage, bonuses, and special actions. You can combine melee weapons, bows, staves, and support.'],['После открытия ворот иди дальше или зачисти боковые поля. Если тяжело — вернись к более простым пачкам, улучши оружие, проверь резисты врага и сохранённый респаун.','Once a gate opens, continue or clear side fields. If combat is too hard, fight easier packs, improve your weapons, check enemy affinities, and check your selected respawn.']]}
    ]},
    {id:'controls',title:['Управление и интерфейс','Controls and interface'],cards:[
      {title:['Движение и дэш','Movement and Dash'],paragraphs:[['На телефоне двигайся плавающим джойстиком. Продави его внешнее кольцо, чтобы сделать дэш. На компьютере — WASD или стрелки; Shift запускает дэш. Оружие само выбирает доступные цели.','On mobile, move with the floating joystick. Push through its outer ring to Dash. On desktop, use WASD or arrow keys; Shift triggers Dash. Weapons choose valid targets automatically.'],['Луки и посохи требуют видимой цели и прямой линии огня. Внутри минимальной дистанции они не стреляют. Выйди из мёртвой зоны или переключись на мили.','Bows and staves require an on-screen target and a clear line of fire. They cannot fire inside their minimum range. Leave the dead zone or switch to melee.']]},
      {title:['Основные кнопки','Main buttons'],paragraphs:[['BAG — коллекция и резерв. FORGE — наковальня 3×3. STATS — итоговые характеристики и STORY. PORTAL — ближайший доступный безопасный рынок. Шестерёнка — настройки, аккаунт и перенос сейва.','BAG opens Collection and Reserved. FORGE opens the 3×3 Anvil. STATS shows effective stats and STORY. PORTAL takes you to the nearest available safe market. The gear opens settings, account controls, and save transfer.'],['Нажми миникарту, чтобы открыть большую карту; двигай её пальцем или мышью. ? открывает встроенный хелп. Портал не открывает закрытые ворота.','Tap the minimap to open the large map, then pan with your finger or mouse. ? opens the in-game help. Market travel does not unlock closed gates.']]},
      {title:['Экипировка и лоадауты','Equipment and loadouts'],wide:true,paragraphs:[['Четыре слота оружия атакуют независимо. Ещё два слота — для орбов. Нажми слот, чтобы осмотреть предмет или заменить его. Можно перетащить конкретный предмет или серый стак на нужный слот.','Four weapon slots act independently. Two additional slots hold Orbs. Tap a slot to inspect or replace its item. You can drag a concrete item or a grey stack onto the desired slot.'],['AUTO подбирает экипировку автоматически. Короткое нажатие 1–5 (на экране или клавиатуре) загружает лоадаут; долгое — сохраняет текущий набор поверх него. Вещи в лоадаутах защищены от автоматического расходования в кузне.','AUTO selects equipment automatically. Tap 1–5 on screen or press and release the matching key to load a loadout; hold to overwrite it with current equipment. Items referenced by loadouts are protected from automatic forge consumption.']]}
    ]},
    {id:'growth',title:['Характеристики и рост','Stats and progression'],lead:['Постоянные награды остаются с персонажем. Бонусы предметов работают, пока предметы надеты. Смотри итоговые значения в STATS.','Permanent rewards stay with your character. Equipment bonuses apply while items are equipped. Check effective values in STATS.'],table:{headers:[['Параметр','Stat'],['Что меняет','What it changes']],rows:[
      [['HP / HP%','HP / HP%'],['Жизнь и её максимум. Процентный HP умножает плоский запас HP и также влияет на регенерацию. Рост максимального HP увеличивает тело, но не отдаляет камеру.','Current and maximum life. HP% multiplies flat HP and also affects regeneration. Higher maximum HP enlarges your body without zooming the camera out.']],
      [['Regen / HP Regen %','Regen / HP Regen %'],['Восстановление HP в секунду. HP Regen % дополнительно умножает регенерацию.','HP restored per second. HP Regen % separately multiplies regeneration.']],
      [['Melee / Ranged / Magic','Melee / Ranged / Magic'],['Сила класса добавляется к собственному урону соответствующего оружия. Урон ванда от этого не появляется.','Class power is added to the corresponding weapon’s own damage. It does not give Wands direct damage.']],
      [['Attack Speed','Attack Speed'],['Сокращает интервалы обычных атак экипированного оружия. КД саппорт-эффектов ванда рассчитывается отдельно.','Shortens normal weapon attack intervals. Wand support cooldowns are calculated separately.']],
      [['Move / Evasion / Block','Move / Evasion / Block'],['Скорость движения / шанс избежать удара / блокирование входящего урона. Мили-оружие может иметь врождённый блок.','Movement speed / chance to avoid a hit / blocking incoming damage. Melee bases can provide innate block.']],
      [['Awareness / Coverage','Awareness / Coverage'],['Внешняя дальность лука и посоха / расширение их полезной зоны внутрь. Это не масштаб камеры и не отмена линии видимости.','Outer bow/staff targeting range / widening the usable range band inward. These do not change camera zoom or remove line-of-sight requirements.']],
      [['Crit Chance / Crit Damage','Crit Chance / Crit Damage'],['Шанс критического удара / множитель каждого уровня крита. Шанс выше 100% может давать несколько уровней крита за удар.','Critical chance / multiplier per critical level. Chances above 100% can produce multiple critical levels in one hit.']],
      [['Lifesteal / Poison / Stun','Lifesteal / Poison / Stun'],['Вампиризм от прямого урона оружия и цепочек / отложенный урон от сработавшего удара / шанс оглушения. Тики яда не дают вампиризм.','Healing from direct weapon and chain damage / damage over time based on the triggering hit / stun chance. Poison ticks do not trigger lifesteal.']],
      [['Dash CD / Dash Range','Dash CD / Dash Range'],['Сокращение КД дэша / увеличение пройденной дистанции. Мили-аффиксы и орбы могут усиливать оба параметра.','Dash cooldown reduction / increased travel distance. Melee affixes and Orbs can improve both.']],
      [['Greed','Greed'],['Увеличивает обычные постоянные награды и число копий дропа; не умножает награды Greed и HP%. У мидбоссов с 3-й локации отдельный плоский шанс 10% на постоянный Greed.','Increases normal permanent rewards and equipment copies; it does not multiply Greed or HP% rewards. From location 3, Minor Bosses have a separate flat 10% chance to award permanent Greed.']],
      [['TOTAL DPS','TOTAL DPS'],['Ожидаемый урон по одной нейтральной цели с учётом скорости атаки, крита и яда. Не учитывает резисты конкретного врага и Action Chains: это не полный замер зачистки.','Expected neutral single-target output including attack speed, crits, and Poison. It excludes enemy affinity and Action Chains, so it is not a complete measure of clearing power.']]
    ]}},
    {id:'inventory',title:['Предметы и хранение','Items and storage'],cards:[
      {title:['Lineage, Quality и аффиксы','Lineage, Quality, and affixes'],paragraphs:[['Lineage — накопленная масса предмета и его ось роста. Серый предмет имеет Lineage 1, без аффиксов и цепочки. Faint, Fed, Dense, Ancient и Absurd — названия диапазонов Lineage, а не отдельные ранги.','Lineage is an item’s accumulated mass and growth axis. A grey item has Lineage 1, no affixes, and no chain. Faint, Fed, Dense, Ancient, and Absurd label Lineage ranges; they are not separate ranks.'],['Quality показывает, насколько эффективно текущий профиль использует Lineage. Ролленный предмет хранит конкретный набор аффиксов, их редкости и доли качества. Temper усиливает этот набор, Reforge заменяет его.','Quality describes how effectively the current profile uses Lineage. A rolled item keeps a specific affix set, rarities, and quality shares. Temper strengthens that set; Reforge replaces it.'],['Собственный урон оружия растёт с Lineage и его стабильным роллом урона. Орб не наносит обычных оружейных атак; ванд не наносит прямого урона вообще.','A weapon’s own damage scales with Lineage and its stable damage roll. Orbs do not make normal weapon attacks; Wands deal no direct damage at all.']]},
      {title:['Collection и Reserved','Collection and Reserved'],paragraphs:[['Collection группирует предметы по базе: серые стаки и группы ролленных. Открой группу, чтобы выбрать конкретную вещь. Reserved хранит предметы по одному; экипированные стоят первыми в порядке слотов.','Collection groups items by base: grey stacks and rolled groups. Open a group to choose a concrete item. Reserved keeps items individually, with equipped items first in slot order.'],['Золотая рамка — обычный предмет; зелёная — надет; синяя — только сохранён в лоадауте. Нажатие открывает карточку, удержание около секунды — быстрые действия. Вертикальный свайп прокручивает список.','Gold means ordinary; green means equipped; blue means referenced only by a loadout. Tap for details, hold for about a second for quick actions. A vertical swipe scrolls the list.'],['Резерв, экипировка и лоадауты защищают от автоматического выбора ингредиентов. Предметы с Action Chain или Payload тоже не берутся автоматически. Ручное уничтожение особого предмета требует подтверждения.','Reserved, equipped, and loadout items are protected from automatic ingredient selection. Items with Action Chains or Payload are also excluded. Manually destroying a special item requires confirmation.']]}
    ]},
    {id:'world',title:['Мир, враги и карта','World, enemies, and map'],cards:[
      {title:['Локации и ворота','Locations and gates'],paragraphs:[['Мир состоит из соседних шестиугольных локаций и внешних колец. В заголовке указаны биом, номер прогресса и Power. Пролог — этап 0; за ним начинаются обычные локации.','The world consists of adjacent hexagonal locations arranged in outward rings. The heading shows biome, progression index, and Power. The prologue is stage 0; ordinary locations follow it.'],['Гейтбосс открывает ворота вперёд. Дополнительные боковые проходы требуют открытия соседних локаций. Попасть на поверхность через данж — не значит открыть её ворота.','A Gate Boss opens the forward gate. Additional side passages depend on neighboring locations being unlocked. Reaching a surface through a dungeon does not unlock its gates.'],['Лес, пустыня, джунгли и арктика различаются оформлением и музыкой. Дороги помогают ориентироваться, но бой и исследование не ограничены дорогой.','Forest, Desert, Jungle, and Arctic differ in scenery and music. Roads help navigation, but exploration and combat are not confined to them.']]},
      {title:['Как выбирать цель','Choosing targets'],paragraphs:[['Три значка Melee / Ranged / Magic над врагом показывают его отношение к типам урона: зелёный — уязвимость, серый — нейтрально, красный — сопротивление. В туторе красных резистов нет.','The Melee / Ranged / Magic icons above an enemy show affinity: green is vulnerable, grey neutral, red resistant. The tutorial has no red resistances.'],['Каждый враг даёт показанную постоянную награду. Обычные враги дают рост; элиты и боссы также дают экипировку. Первый гейтбосс дарит лук; последующие первые убийства гейтбоссов дают гарантированный оружейный подарок.','Every enemy grants its displayed permanent reward. Regulars provide growth; Elites and bosses also drop equipment. The first Gate Boss gives a bow; later first Gate Boss kills grant a guaranteed weapon gift.'],['Рендж и магия отступают, чтобы получить дистанцию выстрела. Сильно слабые обычные и элитные пачки могут убегать; боссы не пугаются. Противник, ушедший в соседнюю локацию, остаётся боевой целью.','Ranged and Magic enemies retreat to regain firing distance. Much weaker Regular and Elite packs can flee; bosses do not. An enemy crossing into a neighboring location remains a combat target.']]}
    ],table:{headers:[['Маркер','Marker'],['Объект','Object']],rows:[
      [['Стрелка / голубое кольцо','Arrow / blue ring'],['Ты / другой игрок шарда.','You / another player in the shard.']],
      [['Красная точка / жёлтый ромб','Red dot / yellow diamond'],['Обычный враг / элита.','Regular enemy / Elite.']],
      [['Золотая точка / оранжевый крест','Gold dot / orange cross'],['Мидбосс / гейтбосс.','Minor Boss / Gate Boss.']],
      [['Крупная фиолетовая печать','Large purple seal'],['Опциональный Fortress Boss.','Optional Fortress Boss.']],
      [['Фиолетовый ромб / розово-фиолетовый ромб','Purple diamond / pink-purple diamond'],['Вейпоинт / стела с надписью.','Waypoint / stella inscription.']],
      [['Янтарный знак магазина','Amber storefront marker'],['Рынок и безопасная зона.','Market and safe zone.']],
      [['Разрыв между концами ворот / сплошная полоса','Gap between gate ends / solid bar'],['Открытый проход / закрытые ворота. Радиальный шорткат отмечен фиолетовым.','Open passage / closed gate. Radial shortcuts are marked purple.']]
    ]}},
    {id:'travel',title:['Вейпоинты, смерть и рынки','Waypoints, death, and markets'],cards:[
      {title:['Вейпоинт — это два разных действия','A waypoint has two separate jobs'],paragraphs:[['Подойти к вейпоинту — зарегистрировать его для путешествий. Это не меняет респаун. В его меню отдельно выбери «респ тут», если хочешь возвращаться сюда после смерти.','Approaching a waypoint registers it for travel. This does not change your respawn. Select the respawn option in its menu if you want to return there after death.'],['Вейпоинты есть в центре и на определённой сетке обычных локаций, не на каждой. При первом входе в подходящую локацию подсказка напоминает, что он находится в центре.','Waypoints exist at the centre and on a particular lattice of ordinary locations, not in every location. A contextual hint on first entry reminds you to look near the location centre.'],['Путешествовать можно к достигнутым вейпоинтам доступных локаций. Внешняя поверхность, достигнутая выходом данжа, разрешает регистрацию и поездки к своему вейпоинту даже при закрытых поверхностных воротах.','Travel is available to reached waypoints in accessible locations. An outer surface reached through a dungeon permits waypoint registration and travel even while its surface gates remain closed.']]},
      {title:['Не беги с базы без необходимости','Avoid unnecessary runs from home'],paragraphs:[['Смерть возвращает к выбранному респауну. Если продолжаешь появляться в центре мира, проверь CURRENT RESPAWN у ближайшего вейпоинта. UNSTUCK RESPAWN также использует выбранную точку.','Death returns you to the selected respawn. If you still appear at the world centre, check CURRENT RESPAWN at a waypoint. UNSTUCK RESPAWN uses that selected point too.'],['PORTAL ведёт на рынок текущей локации, если там есть рынок, и лишь затем ищет другой доступный. В безопасной зоне враги не ведут бой.','PORTAL prefers a market in your current location and only looks elsewhere when none exists there. Enemies cannot fight inside safe zones.'],['У торговцев: обмен серых предметов один к одному, серые наборы за кристаллы, ролленные предложения и операции с кристаллами. Подойди и нажми TRADE. Серые стаки нельзя продать за кристаллы.','Merchants provide one-for-one grey exchanges, grey packs for crystals, rolled offers, and crystal services. Approach and press TRADE. Grey stacks cannot be sold for crystals.']]}
    ]},
    {id:'bosses',title:['Читать босса по телеграфам','Reading boss telegraphs'],lead:['У обычных мидбоссов 1–2 дополнительные механики, у гейтбоссов 2–3. Пролог исключён. Профиль фиксирован для конкретного спавна; не каждый босс умеет всё.','Ordinary Minor Bosses have 1–2 extra mechanics; Gate Bosses have 2–3. The prologue is excluded. Each spawn has a fixed profile, so not every boss has every ability.'],table:{headers:[['Сигнал','Tell'],['Что будет','What follows'],['Как реагировать','Response']],rows:[
      [['Прячет оружие','Hides its weapon'],['Смена мили / рендж-класса. Подготовка 2–4 с; после неё новое оружие сразу вступает в бой. Часть профилей вместо смены имеет два оружия одновременно.','Switches between melee and ranged classes. Wind-up lasts 2–4 seconds; the new weapon attacks afterwards. Some profiles instead carry two simultaneous weapons.'],['Не считай расстояние постоянной защитой; готовься сменить дистанцию.','Do not rely on the same distance remaining safe. Prepare to reposition.']],
      [['Надувается','Inflates'],['Нова — кольцо или разлетающиеся снаряды.','Nova: an expanding ring or outward projectiles.'],['Следи за направлением и временем распространения, используй дэш.','Watch its travel direction and timing; use Dash.']],
      [['Подпрыгивает','Starts hopping'],['Волна 4–8 элитных миньонов. У живых миньонов обычные награды; одновременно у босса не более восьми призванных.','A wave of 4–8 Elite minions. They give normal Elite rewards; a boss has at most eight living summons.'],['Не оставайся внутри новой пачки, освободи пространство.','Avoid being surrounded and make room to move.']],
      [['Сжимается','Shrinks'],['Дэш в выбранного игрока: при нескольких целях выбирается самый слабый по текущему HP.','Dashes toward a selected player; with several targets, it chooses the lowest current HP.'],['Уйди с линии рывка; щит и лечение помогают пережить попадание.','Leave its dash line; shields and healing can help absorb a hit.']]
    ]}},
    {id:'dungeons',title:['Процедурные данжи','Procedural dungeons'],lead:['Ищи будку входа на локациях 4, 6, 8 и далее через одну. Подойди и нажми ENTER DUNGEON; ступени внутри предлагают TO THE SURFACE.','Look for entrance booths in locations 4, 6, 8, and every other location thereafter. Approach and press ENTER DUNGEON; stairs inside offer TO THE SURFACE.'],cards:[
      {title:['Комнаты, ветки и сложность','Rooms, branches, and difficulty'],paragraphs:[['Данж содержит 4–7 комнат, основную цепь и минимум две боковые комнаты-тупика. В каждой комнате — 1–3 пачки по четыре элиты и босс; между комнатами тоже есть элитные пачки.','A dungeon has 4–7 rooms, a main path, and at least two dead-end side rooms. Each room holds 1–3 packs of four Elites and a boss; connecting corridors also contain Elite packs.'],['Сложность растёт с глубиной от основного входа, финальная комната достигает выбранного максимума. Боковые комнаты на одинаковой глубине могут иметь одинаковую сложность. Это не обязательно +1 за каждую дверь.','Difficulty rises with depth from the primary entrance, reaching the selected maximum in the final room. Sibling rooms may share difficulty. Each doorway does not necessarily mean another +1 stage.'],['У данж-боссов 3–4 механики, готовность абилок и телеграфы быстрее, чем на поверхности. Механики идут последовательно: короткий КД не означает одновременный каст всего.','Dungeon bosses have 3–4 mechanics, with faster readiness timers and telegraphs than surface bosses. Abilities serialize; a short cooldown does not mean every ability fires simultaneously.']]},
      {title:['Выход на внешний круг','An exit to the outer ring'],paragraphs:[['С вероятностью 25% финальные ступени ведут на другую локацию следующего внешнего кольца. Иначе они выводят на основную поверхность. Входные ступени всегда возвращают к основному входу.','There is a 25% chance the final stairs lead to a location on the next outer ring. Otherwise they return to the primary surface. Entry stairs always return to the primary entrance.'],['Если зайти с внешней стороны, это тот же данж: идёшь от сложных комнат к простым. Локация может иметь свой данж и вход в чужой. Внешний выход не открывает поверхностные ворота; вейпоинт открыть можно.','Entering from the outer side leads into the same dungeon, from harder rooms toward easier ones. A location may have its own dungeon and an incoming entrance. The exit does not open surface gates, but its waypoint can be registered.'],['Смерть использует выбранный вейпоинт. В мультиплеере убийства в данже распределяют награды по общему правилу участникам этого данжа, включая тех, кто в другой комнате.','Death uses the selected respawn waypoint. In multiplayer, dungeon kills share rewards under the dungeon’s shared-location rule, including participants in other rooms.']]}
    ],table:{headers:[['Максимальная сложность относительно основного входа','Maximum stage above primary entrance'],['Вероятность','Probability']],rows:[[['+1','+1'],['40%','40%']],[['+2','+2'],['30%','30%']],[['+3','+3'],['15%','15%']],[['+4','+4'],['10%','10%']],[['+5','+5'],['5%','5%']]]}},
    {id:'forge',title:['Кузня: от ингредиентов к сборке','Forge: from ingredients to a build'],lead:['Сначала выбери режим операции. Затем — тип предмета в базовом слоте: одинаковый рисунок рецепта даёт разные физические эффекты на разных носителях.','First choose the operation you need. Then select the Base slot item type below: the same recipe has different physical effects on different carriers.'],cards:[
      {title:['Reforge — создать новый профиль','Reforge — create a new profile'],paragraphs:[['Без базового предмета положи не менее трёх вещей одной базы. Все ингредиенты исчезнут; их Lineage сложится в один новый предмет с новым роллом урона и аффиксов.','Without a Base Item, place at least three items of one base. All ingredients are consumed; their Lineage becomes one new item with a new damage roll and affix profile.'],['Альтернатива: ровно один ролленный предмет вне двух базовых клеток + серые ингредиенты. Ролленный определяет базу результата и даёт Lineage, а серые влияют на предпочтения аффиксов. Его старые цепочка и Payload уничтожаются.','Alternatively, use exactly one rolled item outside the two Base anchor cells plus grey ingredients. The rolled item determines the result base and contributes Lineage; only the grey ingredients influence affix bias. Its old chain and Payload are destroyed.'],['Больше массы даёт больше Lineage, но не гарантирует нужный аффикс. Переролл нужен, когда хочешь поменять свойства, а не просто усилить любимую вещь.','More mass gives more Lineage, not a guaranteed desired affix. Use Reforge to change properties rather than simply strengthen a favorite item.']]},
      {title:['Temper — усилить без переролла','Temper — grow without rerolling'],paragraphs:[['Поставь конкретный Base Item в центр или низ по центру. Добавь хотя бы один катализатор так, чтобы не получился рецепт. Весь Lineage катализаторов перейдёт в базу.','Place a concrete Base Item in the centre or bottom-centre. Add at least one catalyst without forming a recipe. All catalyst Lineage is absorbed into the Base.'],['Идентичность предмета, стабильный ролл урона, аффиксы, их редкость и доли, цепочка, Payload и привязки к экипу/лоадаутам сохраняются. Новые аффиксы не появляются. Серый останется без аффиксов.','Item identity, stable damage roll, affixes, rarities and shares, chain, Payload, and equipment/loadout references remain intact. No new affixes appear. A grey item stays affixless.']]},
      {title:['Pattern Forge — добавить действие','Pattern Forge — add an action'],paragraphs:[['Поставь базовый предмет и нарисуй рецепт катализаторами. Кузня сначала поглотит их Lineage как Temper, затем добавит узел действия. Базовый предмет не уничтожается.','Place a Base Item and arrange catalysts into a recipe. The forge first absorbs their Lineage as Temper, then adds an action node. The Base Item is not destroyed.'],['Большинство повторов добавляет следующий узел в конец цепи; Aura объединяется с уже имеющейся аурой. Максимум — восемь узлов. Рецепты не вращаются и не зеркалятся автоматически.','Most repeats append the next node to the chain; Aura merges into an existing aura. The maximum is eight nodes. Recipes do not automatically rotate or mirror.'],['Цепочка исполняется в записанном порядке. Следующий эффект продолжает действие предыдущего, а не всегда стартует от персонажа. Радиус, число целей, длительность и сохранение урона указаны в карточке предмета.','Chains execute in saved order. The next effect continues the previous action rather than always starting at the player. Read radius, target count, duration, and damage retention in the item card.']]},
      {title:['Что сохраняется и что тратится','What is kept and what is spent'],paragraphs:[['FORGE на карточке ставит базу в нижнюю центральную клетку; для Aura перенеси её в центр. Итоговый рисунок определяет режим. Чтобы сделать Temper вместо рецепта, нарушь рисунок.','FORGE on an item card places the Base at bottom-centre; move it to the centre for Aura. The final layout determines the mode. Break a recognized pattern to request Temper.'],['Черновик наковальни сохраняется. Перестановка между клетками не уничтожает вещи. Завершённый результат автоматически попадает в Reserved. Коллекционный выбор ингредиентов не включает надетые предметы.','The Anvil draft is saved. Moving items between cells does not destroy them. Completed results are placed in Reserved automatically. Collection ingredient selection excludes equipped items.'],['Проверь превью перед запуском: именно оно показывает расход, режим и результат для текущего набора. Ручное согласие на разрушение защищённой вещи снимает её ссылки в экипе и лоадаутах.','Check the preview before executing: it shows consumption, mode, and result for the current layout. Confirming manual destruction of a protected item clears its equipment and loadout references.']]}
    ],note:['Сохранение урона (retention): Split передаёт 70%, Wall и Cone — 20% на шаг. Для остальных узлов применяется ролл retention. Несколько узлов последовательно уменьшают урон; бесконечного размножения нет — действуют лимиты попаданий и снарядов.','Damage retention: Split passes 70%, Wall and Cone 20% per step. Other nodes use their rolled retention. Consecutive nodes compound the reduction; hit and projectile budgets prevent unlimited multiplication.']},
    {id:'multiplayer',title:['Мультиплеер и поддержка группы','Multiplayer and party support'],cards:[
      {title:['Комнаты и совместный бой','Rooms and cooperative combat'],paragraphs:[['В ростере открой MULTIPLAYER: создай комнату или войди в существующую. Вместимость шарда — до восьми игроков. Если сервер спит, первый запуск может занять до двух минут; сообщение ожидания — нормальное состояние.','Open MULTIPLAYER in the roster to create or join a room. A shard supports up to eight players. A sleeping server may take up to two minutes to start; the waiting message is normal.'],['В комнате общие враги, HP противников и открытия ворот. За совместные убийства приходят личные награды с твоим Greed. Состояние комнаты временное: после перезапуска сервера оно исчезает; прогресс персонажа хранится отдельно.','Rooms share enemies, enemy HP, and gate openings. Shared kills deliver personal rewards using your Greed. Room state is temporary and disappears on a server restart; character progress is saved separately.']]},
      {title:['FOLLOW и пати-вью','FOLLOW and the party strip'],paragraphs:[['Подойди к союзнику и нажми FOLLOW, чтобы идти за ним. Любой твой ввод отменяет следование; это не телепорт и не боевой бот.','Approach an ally and press FOLLOW to follow their movement. Any manual input cancels it; this is neither a teleport nor a combat bot.'],['Пати-панель над названием локации переключается между скрыто / эта локация / весь шард. В ней видны ники, HP и прогресс действия баффов; длинные ники сокращаются.','The party strip above the location heading cycles through hidden / this location / entire shard. It shows names, HP, and buff progress; long names are trimmed.'],['Саппорт-ванды сами ищут подходящую живую цель рядом: себя или союзника на той же локации. Лечение предпочитает нуждающихся; баффы — цели без этого эффекта. Подробности КД и силы — во вкладке Wand в разделе кузни.','Support Wands automatically choose an eligible living target nearby: yourself or an ally in the same location. Healing prioritizes need; buffs prefer targets without that effect. See the Wand crafting tab for cooldowns and potency.']]}
    ]},
    {id:'saves',title:['Сейвы, аккаунт и перенос','Saves, account, and transfer'],cards:[
      {title:['Локальный и облачный прогресс','Local and cloud progress'],paragraphs:[['Автосейв объединяет изменения примерно раз в 24 секунды. В WebGL локальный прогресс хранится в данных браузера. Очистка данных сайта может его удалить — сохраняй экспорт важного персонажа.','Autosave coalesces changes roughly every 24 seconds. WebGL local progress lives in browser data. Clearing site data can remove it; export important characters as a backup.'],['Google-вход нужен внутри игры через ACCOUNT; вход в аккаунт itch сам по себе не подключает игровой облачный сейв. Бета, test-tutor и itch используют одни облачные слоты при входе в тот же игровой аккаунт.','Sign in with Google inside the game through ACCOUNT. Signing into itch does not connect the game’s cloud save. Beta, test-tutor, and itch use the same cloud slots when you sign into the same game account.'],['Персонажи имеют отдельные полные сейвы; ростер — список и общие настройки. При конфликте внимательно сравни локальную и облачную версии перед выбором. Не перезаписывай старый прогресс пустым ростером.','Each character has a separate full save; the roster stores summaries and shared settings. Compare local and cloud versions carefully before resolving a conflict. Do not overwrite existing progress with an empty roster.']]},
      {title:['Экспорт — страховка и перенос','Export for backup and transfer'],paragraphs:[['В настройках экспортируй читаемый JSON или компактный код SP1. Оба содержат полный сейв; SP1 удобен для сообщения. Импорт сначала показывает превью, создаёт резервную копию текущего сейва и перезапускает игру.','Export a readable JSON or compact SP1 code in settings. Both contain the full save; SP1 is convenient for messaging. Import previews the data, backs up the current save, and restarts the game.'],['Постоянно сохраняются характеристики, предметы, ворота, вейпоинты и прочитанная история. HP врагов, их смерти, активные баффы и таймеры респауна — состояние текущей сессии. Перезапуск пересоздаёт встречи.','Stats, items, gates, waypoints, and read Story persist. Enemy HP, enemy deaths, active buffs, and respawn timers are session state. Relaunching recreates encounters.'],['КД эффектов вандов сохраняются отдельно для каждой вещи и эффекта. Переключение лоадаута и перезаход не сбрасывают их.','Wand cooldowns are saved separately for each item and effect. Loadout switches and relogging do not reset them.']]}

    {id:'settings',title:['Настройки, история и частые вопросы','Settings, Story, and common questions'],cards:[
      {title:['Подстрой игру под экран','Fit the game to your screen'],paragraphs:[['Музыка и звуковые эффекты регулируются отдельно. VIEW DISTANCE меняет видимую область; не дальность оружия. SHOW MINIMAP скрывает миникарту. SHOW PERFORMANCE HUD включает диагностические показатели.','Music and sound effects have separate volume controls. VIEW DISTANCE changes the visible area, not weapon range. SHOW MINIMAP hides the minimap. SHOW PERFORMANCE HUD enables diagnostic metrics.'],['На компьютере можно осматривать камеру правой кнопкой мыши и Ctrl + колесом. При отдалении интерфейс скрывается; R возвращает камеру и интерфейс. Это инструмент осмотра, а не боевая способность.','On desktop, inspect the camera with right-mouse drag and Ctrl + wheel. Zooming out hides the interface; R restores the camera and UI. This is an inspection tool, not a combat ability.']]},
      {title:['Стелы — история, а не кнопки прогресса','Stellae are Story, not progress buttons'],paragraphs:[['Подойди к стеле и прочитай надпись. Прочитанный фрагмент остаётся в STATS → STORY и переносится с сейвом. Пропуски показывают, что ещё не найдено.','Approach a stella and read its inscription. Read fragments stay in STATS → STORY and transfer with your save. Gaps show which pieces you have not found.'],['Сюжетные надписи и учебные карточки — разные вещи. Карточку можно закрыть; это не выключает маршрутную подсказку и не блокирует ворота.','Story inscriptions and tutorial cards are separate. Dismissing a card does not disable route guidance or block gates.']]}
    ],faq:[
      {q:['Почему лук перестал стрелять в упор?','Why does my bow stop firing at close range?'],a:['У него есть мёртвая зона. Отойди, проверь видимость и тип резиста цели. Coverage расширяет полезную полосу внутрь, но не превращает лук в мили.','It has a dead zone. Move away and check visibility and target affinity. Coverage widens the band inward but does not turn a bow into a melee weapon.']},
      {q:['Почему улучшение не добавило аффикс?','Why did an upgrade not add an affix?'],a:['Temper и Pattern Forge сохраняют набор обычных аффиксов. Для нового набора нужен Reforge; это уничтожит исходную вещь. Pattern Forge добавляет действие, не обычный аффикс.','Temper and Pattern Forge preserve ordinary affixes. Reforge creates a new set but consumes the original item. Pattern Forge adds an action, not an ordinary affix.']},
      {q:['Почему ванд не ресает уже мёртвого союзника?','Why does my Wand not revive an already dead ally?'],a:['Second Life — предварительный бафф на 45 секунд. Он срабатывает на смертельном ударе, пока действует, и расходуется. Это не ручное воскрешение лежащего персонажа.','Second Life is a pre-applied 45-second buff. It triggers on a lethal hit while active and is consumed. It is not a manual resurrection of an already dead character.']},

    ['Пороги Lineage открывают возможность ролла, а не гарантируют эффект. Вторичные свойства появляются по глубине Lineage: до трёх, то есть максимум четыре независимых эффекта с учётом основного.','Lineage thresholds unlock roll possibilities, not guaranteed effects. Secondary properties increase with Lineage depth, up to three: at most four independent effects including the primary.'],
    ['Таблица показывает КД без Quickening. Он уменьшает КД всех эффектов этого ванда, суммарное снижение ограничено 50%; Second Life всё равно не ниже 90 с. Temper увеличивает Lineage и силу, но не добавляет свойства и не меняет их тип.','The table shows cooldowns without Quickening. Quickening reduces all effect cooldowns on that Wand, capped at 50% total reduction; Second Life still cannot drop below 90 seconds. Temper increases Lineage and potency without adding or changing properties.'],
    ['Каждый эффект каждого ванда имеет отдельный КД, привязанный к конкретной вещи. Поэтому несколько вандов дают независимые применения, а переключение лоадаута не обнуляет таймеры.','Each effect on each Wand has its own cooldown tied to that concrete item. Multiple Wands therefore provide independent casts; changing loadouts does not reset timers.'],
    ['Баффы одного типа на персонаже не складываются отдельными слоями: новое применение обновляет этот эффект. Снаряды поддержки летят вдвое быстрее обычных магических болтов. HP-бар показывает цвет последнего попадания поддержки и вспыхивает при срабатывании; пати-панель показывает длительность.','Same-type buffs do not stack as separate layers on a character: another application refreshes that effect. Support projectiles travel twice as fast as normal magic bolts. The HP bar shows the last support impact’s colour and flashes on procs; the party strip shows duration.'],
    ['Для примера: серый ванд Lineage 1 лечит 12 HP раз в 3.5 секунды, когда есть подходящая раненая цель. Ванд Lineage 100 с Heal без Potency лечит 1200 HP за применение.','Example: a grey Lineage 1 Wand heals 12 HP every 3.5 seconds when an eligible injured target exists. A Lineage 100 Heal Wand without Potency heals 1200 HP per cast.']
  ];
  const craftNotes = [
    ['Состав катализаторов не равен типу результата. В Pattern Forge база остаётся прежней; в смешанном Reforge результат задаёт единственный ролленный ингредиент.','Catalyst composition is not the output base. Pattern Forge keeps the Base; mixed Reforge uses its single rolled ingredient to determine the output.'],
    ['Drive → Burst — сначала продолжение попадания, затем взрыв от достигнутых целей. Burst → Drive — сначала область, затем продолжения от её попаданий. Порядок меняет поведение; не переставляй слова как синонимы.','Drive → Burst continues a hit first, then bursts from reached targets. Burst → Drive applies the area first, then continues its hits. Order changes behavior; the names are not interchangeable.'],
    ['Для мили Split, Wall и Cone используют половину соответствующего диапазона узла. Для Wall поперечная полуширина — range / 2.5. Снаряды и области имеют бюджеты: число попаданий ограничено.','Melee Split, Wall, and Cone use half the corresponding node range. Wall cross-axis half-width is range / 2.5. Projectiles and areas use shared budgets, so hit counts are bounded.'],
    ['Payload — дополнительная полезная нагрузка цепочки, а не новый слот экипировки. Она сохраняется при Temper и Pattern Forge, но теряется вместе с предметом при Reforge. Точные значения смотри в карточке вещи.','Payload is extra chain behavior, not another equipment slot. It survives Temper and Pattern Forge but is lost with the consumed item in Reforge. Read exact values in the item card.']
  ];
  sections.find(s=>s.id==='growth').cards = [{
    title:['Из чего получается урон','How weapon damage is built'],wide:true,paragraphs:[
      ['Собственный урон = max(урон базы, Lineage × коэффициент оружия × стабильный ролл). Коэффициент зависит от базы и экономической калибровки; это не одинаковая сила каждого очка Lineage на любом оружии.','Own weapon damage = max(base damage, Lineage × weapon coefficient × stable roll). The coefficient depends on the base and economy calibration; one Lineage does not give identical damage on every weapon.'],
      ['Прямой урон до крита и резистов = собственный урон + сила соответствующего класса. Затем работают критические уровни, свойства удара и отношение цели к этому типу урона. Стабильный ролл сохраняется при Temper, но создаётся заново при Reforge.','Direct damage before crits and affinities = own weapon damage + corresponding class power. Critical levels, hit properties, and target affinity then apply. Temper keeps the stable roll; Reforge creates a new one.'],
      ['Пример сохранения урона цепочки: попадание 100 → Split даёт ветви по 70 → Wall продолжает их с 14. Это коэффициенты отдельных шагов, не +70% и +20% к исходному удару. Реальные попадания ещё зависят от геометрии и целей.','Retention example: a 100 hit → Split produces 70-damage branches → Wall continues them at 14. These are per-step multipliers, not +70% and +20% added to the original hit. Actual hits still depend on geometry and targets.']
    ]
  }];
  sections.find(s=>s.id==='multiplayer').cards[0].paragraphs.push([
    'Множитель встречи = 1 + 0.2 × (игроки на локации − 1): вдвоём 1.2×, втроём 1.4×, максимум 2.4× при восьми. Он увеличивает HP, урон врагов и награды и фиксируется при активации встречи; вход/выход посреди боя его не пересчитывает. Отдельного призового множителя за дополнительные механики босса нет.',
    'Encounter multiplier = 1 + 0.2 × (players in the location − 1): 1.2× for two, 1.4× for three, up to 2.4× for eight. It increases enemy HP, damage, and rewards and is frozen when the encounter activates; joining or leaving mid-fight does not recalculate it. Extra boss mechanics have no additional prize multiplier.'
  ]);
  wandNotes.push([
    'Вторичные свойства открываются при Lineage 25 / 625 / 15625: одно / два / три соответственно. Дополнительный эффект может выпасть только из уже доступного по Lineage пула. Для союзников радиус автовыбора — 28 мировых единиц на той же локации.',
    'Secondary properties unlock at Lineage 25 / 625 / 15625: one / two / three respectively. Additional effects can only come from the pool already available at that Lineage. Ally automatic selection reaches 28 world units within the same location.'
  ]);
  wandNotes.push([
    'Точная доля HP Second Life: clamp(0.25 + 0.05 × log10(Lineage) × Potency, 0.25, 0.90). Поэтому при первом доступном Lineage 3125 и Potency 1 получается примерно 42% HP; 25% — нижняя граница формулы, не обещание силы первого ролла.',
    'Exact Second Life HP fraction: clamp(0.25 + 0.05 × log10(Lineage) × Potency, 0.25, 0.90). At its first available Lineage of 3125 with Potency 1 this is about 42% HP; 25% is the formula floor, not the expected first roll.'
  ]);
  const sources = [
    ['Assets/Scripts/UI/HUDController.cs','Интерфейс, встроенный хелп и подсказки','Interface, in-game help, and hints'],
    ['Assets/Scripts/Forge/RitualForgeService.cs','Рецепты, режимы и цепочки кузни','Recipes, forge modes, and chains'],
    ['Assets/Scripts/Forge/ForgeService.cs','Роллы, аффиксы и рост предметов','Rolls, affixes, and item growth'],
    ['Assets/Scripts/Combat/CombatMath.cs','Сохранение урона и геометрия действий','Damage retention and action geometry'],
    ['Assets/Scripts/Combat/ProjectilePool.cs','Поведение лука и посоха','Bow and Staff behavior'],
    ['Assets/Scripts/World/WorldRuntime.cs','Мили, орбы, награды и ворота','Melee, Orbs, rewards, and gates'],
    ['Assets/Scripts/Core/SupportRules.cs','Эффекты вандов, пороги и КД','Wand effects, thresholds, and cooldowns'],
    ['Assets/Scripts/Character/PlayerController.cs','Доставка поддержки и применение баффов','Support delivery and buff application'],
    ['Assets/Scripts/Multiplayer/MultiplayerSessionRules.cs','Множитель встречи и лимит игроков','Encounter multiplier and player capacity'],
    ['DUNGEON_V0.md','Актуальные правила процедурных данжей','Current procedural dungeon rules'],
    ['AGENTS.md','Сохранения, облако и ограничения реализации','Saves, cloud, and implementation constraints']
  ];

  let language = 'ru', selectedWeapon = 'dagger';
  const langIndex = () => language === 'ru' ? 0 : 1;
  const t = value => Array.isArray(value) ? value[langIndex()] : value;
  const escapeHtml = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const txt = value => escapeHtml(t(value));
  const storage = {get(key){try{return localStorage.getItem(key)}catch{return null}},set(key,value){try{localStorage.setItem(key,value)}catch{}}};
  function readRoute(){
    const url = new URL(location.href);
    const lang = url.searchParams.get('lang') || storage.get('spherefarer-guide-language');
    if (lang === 'ru' || lang === 'en') language = lang;
    const weapon = url.searchParams.get('weapon') || storage.get('spherefarer-guide-weapon');
    if (weapons.some(w => w.id === weapon)) selectedWeapon = weapon;
  }
  function saveRoute(){
    storage.set('spherefarer-guide-language',language);storage.set('spherefarer-guide-weapon',selectedWeapon);
    const url = new URL(location.href);url.searchParams.set('lang',language);url.searchParams.set('weapon',selectedWeapon);
    try{history.replaceState(null,'',url)}catch{}
  }
  function renderTable(table){return `<div class="table-wrap"><table><thead><tr>${table.headers.map(h=>`<th scope="col">${txt(h)}</th>`).join('')}</tr></thead><tbody>${table.rows.map(row=>`<tr>${row.map(c=>`<td>${txt(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;}
  function renderCard(c){return `<article class="card ${c.wide?'wide':''}"><h3>${txt(c.title)}</h3>${c.paragraphs.map(p=>`<p>${txt(p)}</p>`).join('')}</article>`;}
  function recipeGrid(r){
    return `<div class="grid" role="img" aria-label="${txt(ui.recipeLabels)}: ${Array.from({length:9},(_,i)=>i===r.base?'B':r.required.includes(i)?'X':r.optional.includes(i)?'+':'.').join(' ')}">${Array.from({length:9},(_,i)=>{const cls=i===r.base?'base':r.required.includes(i)?'required':r.optional.includes(i)?'optional':'';return `<span class="cell ${cls}" aria-hidden="true">${i===r.base?'B':r.required.includes(i)?'X':r.optional.includes(i)?'+':'·'}</span>`}).join('')}</div>`;
  }
  function renderSupport(){
    return `<div class="callout">${txt(['Боевые рецепты ниже к ванду не применяются. Нужный эффект получают через Reforge, сохраняют и усиливают через Temper.','Combat recipes do not apply to Wands. Roll effects through Reforge; preserve and strengthen them through Temper.'])}</div>${renderTable({headers:[ui.effect,ui.cooldown,ui.duration,ui.threshold,ui.description],rows:support.map(s=>[s.name,s.cd,s.duration,s.mass,s.desc])}).replace('class="table-wrap"','class="table-wrap support-table"')}<h4>${txt(['КД, выбор цели и сила','Cooldowns, targeting, and potency'])}</h4>${wandNotes.map(n=>`<p>${txt(n)}</p>`).join('')}`;
  }
  function renderCraft(){
    return `<h3 id="craft-tabs" style="margin-top:28px">${txt(ui.carrier)}</h3><div class="tablist" role="tablist" aria-label="${txt(ui.carrier)}">${weapons.map(w=>`<button type="button" role="tab" id="tab-${w.id}" aria-controls="panel-${w.id}" aria-selected="${w.id===selectedWeapon}" tabindex="${w.id===selectedWeapon?0:-1}" data-weapon="${w.id}">${txt(w.name)} <span lang="en">${language==='ru'?'/ '+w.id[0].toUpperCase()+w.id.slice(1):''}</span></button>`).join('')}</div>${weapons.map(w=>`<div class="tabpanel" role="tabpanel" id="panel-${w.id}" aria-labelledby="tab-${w.id}" tabindex="0" ${w.id===selectedWeapon?'':'hidden'}><div class="weapon-head"><span class="weapon-symbol" aria-hidden="true">${w.symbol}</span><div><h3>${txt(w.name)}</h3><p>${txt(w.kind)}</p></div></div><p>${txt(w.intro)}</p><p class="lead">${txt(w.bias)}</p>${w.id==='wand'?renderSupport():`<p class="legend">${txt(ui.legend)}</p><div class="recipes">${recipes.map(r=>`<article class="recipe"><h4>${txt(r.name)}</h4><div class="recipe-body">${recipeGrid(r)}<p>${txt(w.effects[r.id])}</p></div></article>`).join('')}</div><p class="legend">${txt(ui.auraAlt)}</p>${recipeGrid({base:4,required:[0,2,6,8],optional:[1,3,5,7]})}`}</div>`).join('')}<h3 style="margin-top:24px">${txt(['Как читать цепочку','How to read a chain'])}</h3><div class="chain" aria-label="${txt(['Пример порядка узлов','Example node order'])}"><span>Drive</span><span aria-hidden="true">→</span><span>Burst</span><span aria-hidden="true">→</span><span>Wall</span></div>${craftNotes.map(n=>`<p>${txt(n)}</p>`).join('')}`;
  }
  function render(){
    document.documentElement.lang=language;document.title=`Spherefarer — ${t(ui.title)}`;
    document.querySelector('meta[name=description]').content=t(ui.intro);
    document.getElementById('skip').textContent=t(ui.skip);document.getElementById('print').textContent=t(ui.print);
    document.getElementById('nav-caption').textContent=t(ui.contents);document.getElementById('mobile-summary').textContent=t(ui.contents);
    document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===language)));
    const nav=sections.map((s,i)=>`<a href="#${s.id}">${String(i+1).padStart(2,'0')} · ${txt(s.title)}</a>`).join('');
    for(const id of ['desktop-nav','mobile-nav']){const el=document.getElementById(id);el.innerHTML=nav;el.setAttribute('aria-label',t(ui.contents));}
    document.getElementById('guide').innerHTML=`<section class="hero" aria-labelledby="page-title"><span class="eyebrow">${txt(ui.eyebrow)}</span><h1 id="page-title">${txt(ui.title)}</h1><p>${txt(ui.intro)}</p><div class="hero-links"><a href="#start">${txt(ui.quick)}</a><a href="#craft-tabs">${txt(ui.forge)}</a><a href="https://www0z0k.github.io/ami-locals-web/stu-peasy-beta.html" target="_blank" rel="noopener">${txt(ui.play)}</a></div><p class="meta">${txt(ui.meta)}</p></section>${sections.map((s,i)=>`<section class="section" id="${s.id}" aria-labelledby="heading-${s.id}"><div class="section-head"><span class="section-number" aria-hidden="true">${String(i+1).padStart(2,'0')}</span><h2 id="heading-${s.id}">${txt(s.title)}</h2></div>${s.lead?`<p class="lead">${txt(s.lead)}</p>`:''}${s.cards?`<div class="cards">${s.cards.map(renderCard).join('')}</div>`:''}${s.table?renderTable(s.table):''}${s.note?`<div class="callout">${txt(s.note)}</div>`:''}${s.id==='forge'?renderCraft():''}${s.faq?s.faq.map(f=>`<details><summary>${txt(f.q)}</summary><p>${txt(f.a)}</p></details>`).join(''):''}</section>`).join('')}<section class="section" id="sources"><h2>${txt(['Откуда взяты правила','Where the rules come from'])}</h2><p class="lead">${txt(['При обновлении баланса этот хелп нужно сверять с реализацией. Источники ниже — файлы проекта, не внешние ссылки.','When balance changes, this guide should be checked against implementation. The sources below are project files, not external links.'])}</p><ul class="source-list">${sources.map(s=>`<li><code>${escapeHtml(s[0])}</code> — ${escapeHtml(s[langIndex()+1])}</li>`).join('')}</ul></section><footer class="footer"><p>${txt(ui.footer)}</p><p>${txt(ui.fullPrint)}</p><a class="top-link" href="#top">${txt(ui.back)}</a></footer>`;
    bindTabs();observeSections();
  }
  function selectWeapon(id,focus=false){
    if(!weapons.some(w=>w.id===id))return;
    selectedWeapon=id;
    document.querySelectorAll('[data-weapon]').forEach(b=>{const active=b.dataset.weapon===id;b.setAttribute('aria-selected',String(active));b.tabIndex=active?0:-1});
    weapons.forEach(w=>document.getElementById(`panel-${w.id}`).hidden=w.id!==id);saveRoute();
    if(focus)document.getElementById(`tab-${id}`).focus();
  }
  function bindTabs(){document.querySelectorAll('[data-weapon]').forEach(b=>{
    b.addEventListener('click',()=>selectWeapon(b.dataset.weapon));
    b.addEventListener('keydown',e=>{let index=weapons.findIndex(w=>w.id===b.dataset.weapon);if(e.key==='ArrowRight')index=(index+1)%weapons.length;else if(e.key==='ArrowLeft')index=(index+weapons.length-1)%weapons.length;else if(e.key==='Home')index=0;else if(e.key==='End')index=weapons.length-1;else return;e.preventDefault();selectWeapon(weapons[index].id,true)});
  });}
  let navFrame=0;
  function observeSections(){
    const active=[...document.querySelectorAll('.section')].filter(s=>s.getBoundingClientRect().top<=130).at(-1);
    document.querySelectorAll('#desktop-nav a').forEach(a=>a.setAttribute('aria-current',String(a.hash===`#${active?.id}`)));
  }
  window.addEventListener('scroll',()=>{if(navFrame)return;navFrame=requestAnimationFrame(()=>{navFrame=0;observeSections()})},{passive:true});
  document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{
    if(language===b.dataset.lang)return;
    // Keep the reader at the same passage despite translated text changing page height.
    const candidates=[...document.querySelectorAll('.section,.hero')];
    const anchor=candidates.filter(s=>s.getBoundingClientRect().top<=110).at(-1);
    const anchorId=anchor?.id;const relativeTop=anchor?.getBoundingClientRect().top;
    language=b.dataset.lang;saveRoute();render();
    if(anchorId){const current=document.getElementById(anchorId);window.scrollBy(0,current.getBoundingClientRect().top-relativeTop)}
  }));
  document.getElementById('print').addEventListener('click',()=>window.print());
  let expandedForPrint=[];
  window.addEventListener('beforeprint',()=>{expandedForPrint=[...document.querySelectorAll('details:not([open])')];expandedForPrint.forEach(d=>d.open=true)});
  window.addEventListener('afterprint',()=>{expandedForPrint.forEach(d=>d.open=false);expandedForPrint=[]});
  window.addEventListener('popstate',()=>{readRoute();render()});
  readRoute();render();
  if(location.hash)requestAnimationFrame(()=>document.getElementById(location.hash.slice(1))?.scrollIntoView());
  </script>
</body>
</html>
